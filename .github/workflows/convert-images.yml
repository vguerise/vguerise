name: Convert Images to WebP

on:
  push:
    branches: [main]
    paths:
      - 'images/**.jpg'
      - 'images/**.png'
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install WebP tools
        run: sudo apt-get install -y webp

      - name: Convert images to WebP
        run: |
          for img in images/*.jpg images/*.png; do
            [ -f "$img" ] || continue
            base="${img%.*}"
            [ -f "${base}.webp" ] && continue
            cwebp -q 82 "$img" -o "${base}.webp"
            echo "Converted: $img"
          done

      - name: Commit WebP files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/*.webp 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No new WebP files."
          else
            git commit -m "chore: add WebP versions of images [skip ci]"
            git push
          fi