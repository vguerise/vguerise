<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FFFFFF">
  <title>Radar · Perfumes Nicho</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --orange: #E85D04;
      --orange-light: #F48C06;
      --orange-pale: #FFF3EC;
      --black: #111111;
      --gray-900: #1A1A1A;
      --gray-700: #444444;
      --gray-500: #777777;
      --gray-300: #CCCCCC;
      --gray-100: #F2F2F0;
      --white: #FFFFFF;
      --success: #1E8449;
      --danger: #C0392B;
      --bg: #F5F4F1;
      --card-bg: #FFFFFF;
      --border: #E0DED9;
    }

    body {
      background: var(--bg);
      color: var(--black);
      font-family: 'DM Sans', sans-serif;
      min-height: 100dvh;
    }

    .screen { display: none; }
    .screen.active { display: flex; flex-direction: column; min-height: 100dvh; }

    /* ─── LOGIN ─── */
    #screen-login {
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      background: radial-gradient(ellipse at 50% -20%, #fff3ec 0%, var(--bg) 60%);
    }

    .login-card { width: 100%; max-width: 400px; }

    .login-eyebrow {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--orange);
      margin-bottom: 32px;
      text-align: center;
    }

    .login-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 32px;
      font-weight: 900;
      line-height: 1.15;
      text-align: center;
      color: var(--black);
      margin-bottom: 10px;
    }

    .login-subtitle {
      font-size: 15px;
      font-weight: 300;
      color: var(--gray-500);
      text-align: center;
      line-height: 1.6;
      margin-bottom: 40px;
    }

    .login-form { display: flex; flex-direction: column; gap: 12px; }

    .input-field {
      background: var(--white);
      border: 1.5px solid var(--border);
      color: var(--black);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      padding: 14px 18px;
      border-radius: 10px;
      outline: none;
      width: 100%;
      transition: border-color 0.2s;
    }

    .input-field:focus { border-color: var(--orange); }
    .input-field::placeholder { color: var(--gray-300); }

    .btn-primary {
      background: var(--orange);
      color: var(--white);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.03em;
      padding: 14px 24px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-primary:hover { background: var(--orange-light); }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .form-error {
      font-size: 13px;
      color: var(--danger);
      text-align: center;
      min-height: 18px;
    }

    /* ─── APP ─── */
    #screen-app { flex-direction: column; }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      background: var(--white);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .app-brand {
      font-family: 'Montserrat', sans-serif;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--orange);
    }

    .btn-logout {
      background: none;
      border: 1.5px solid var(--border);
      color: var(--gray-500);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }

    .btn-logout:hover { border-color: var(--gray-500); color: var(--black); }

    /* ─── SEARCH ─── */
    .search-bar {
      display: flex;
      justify-content: center;
      padding: 20px 24px 0;
    }

    .search-row {
      display: flex;
      width: 100%;
      max-width: 620px;
      gap: 8px;
    }

    .input-search {
      flex: 1;
      background: var(--white);
      border: 1.5px solid var(--border);
      color: var(--black);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      padding: 13px 18px;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-search:focus { border-color: var(--orange); box-shadow: 0 0 0 3px rgba(232,93,4,0.1); }
    .input-search::placeholder { color: var(--gray-300); }

    .btn-search {
      background: var(--orange);
      color: var(--white);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 700;
      padding: 13px 22px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }

    .btn-search:hover { background: var(--orange-light); }
    .btn-search:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ─── FEATURED ─── */
    #featured-section {
      padding: 24px 20px 48px;
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
    }

    .featured-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .featured-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--orange);
    }

    .featured-count {
      font-size: 12px;
      color: var(--gray-500);
    }

    .perf-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    @media (min-width: 520px) { .perf-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 760px) { .perf-grid { grid-template-columns: repeat(4, 1fr); } }

    .perf-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
    }

    .perf-card:hover {
      border-color: var(--orange);
      box-shadow: 0 4px 16px rgba(232,93,4,0.12);
      transform: translateY(-2px);
    }

    .perf-card-thumb {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      display: block;
      background: var(--gray-100);
    }

    .perf-card-placeholder {
      width: 100%;
      aspect-ratio: 1;
      background: var(--gray-100);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Montserrat', sans-serif;
      font-size: 40px;
      font-weight: 900;
      color: var(--gray-300);
    }

    .perf-card-body { padding: 12px 14px 14px; }

    .perf-card-brand {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--orange);
      margin-bottom: 3px;
    }

    .perf-card-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--black);
      line-height: 1.3;
      margin-bottom: 10px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .perf-card-footer {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 4px;
    }

    .perf-card-price {
      font-family: 'Montserrat', sans-serif;
      font-size: 16px;
      font-weight: 900;
      color: var(--orange);
    }

    .perf-card-store {
      font-size: 10px;
      color: var(--gray-500);
      margin-top: 2px;
    }

    .savings-badge {
      background: #E8F5EE;
      color: var(--success);
      border: 1px solid #C3E6CB;
      font-size: 10px;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 20px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ─── RESULTS ─── */
    .results-wrap {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      padding: 24px 24px 48px;
    }

    .results-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 12px;
      color: var(--gray-500);
      margin-bottom: 16px;
    }

    .btn-back {
      background: none;
      border: none;
      color: var(--orange);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      padding: 0;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .btn-back:hover { text-decoration: underline; }

    .result-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 20px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .result-card:hover { border-color: var(--gray-300); box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .result-card.cheapest { border-color: var(--orange); box-shadow: 0 2px 12px rgba(232,93,4,0.1); }

    .result-rank {
      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      font-weight: 900;
      color: var(--gray-300);
      width: 20px;
      flex-shrink: 0;
    }

    .result-card.cheapest .result-rank { color: var(--orange); }

    .result-info { flex: 1; min-width: 0; }

    .result-store {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gray-500);
      margin-bottom: 3px;
    }

    .result-name {
      font-size: 14px;
      font-weight: 500;
      color: var(--black);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 3px;
    }

    .result-updated { font-size: 11px; color: var(--gray-300); }

    .result-price-block { text-align: right; flex-shrink: 0; }

    .result-price {
      font-family: 'Montserrat', sans-serif;
      font-size: 20px;
      font-weight: 900;
      color: var(--black);
      margin-bottom: 10px;
    }

    .result-card.cheapest .result-price { color: var(--orange); }

    .btn-offer {
      display: inline-block;
      background: none;
      border: 1.5px solid var(--border);
      color: var(--gray-700);
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
      white-space: nowrap;
    }

    .btn-offer:hover { background: var(--orange); border-color: var(--orange); color: var(--white); }

    .state-box {
      text-align: center;
      color: var(--gray-500);
      font-size: 14px;
      padding: 64px 0;
    }

    .spinner {
      width: 26px;
      height: 26px;
      border: 2px solid var(--border);
      border-top-color: var(--orange);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      margin: 0 auto 18px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── MODAL ─── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 100;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-overlay.open { display: flex; }

    @media (min-width: 600px) {
      .modal-overlay { align-items: center; padding: 24px; }
      .modal-box { border-radius: 16px; max-width: 540px; }
    }

    .modal-box {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 16px 16px 0 0;
      width: 100%;
      max-height: 92dvh;
      overflow-y: auto;
    }

    .modal-topbar {
      display: flex;
      justify-content: flex-end;
      padding: 12px 14px 0;
      position: sticky;
      top: 0;
      background: var(--white);
      z-index: 1;
    }

    .modal-close {
      background: var(--gray-100);
      border: none;
      color: var(--gray-500);
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      padding: 7px 10px;
      border-radius: 8px;
      transition: background 0.15s, color 0.15s;
    }

    .modal-close:hover { background: var(--border); color: var(--black); }

    .modal-img {
      width: 100%;
      max-height: 280px;
      object-fit: cover;
      display: block;
    }

    .modal-placeholder {
      width: 100%;
      height: 220px;
      background: var(--gray-100);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Montserrat', sans-serif;
      font-size: 80px;
      font-weight: 900;
      color: var(--gray-300);
    }

    .modal-content { padding: 20px 24px 32px; }

    .modal-brand {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--orange);
      margin-bottom: 4px;
    }

    .modal-name {
      font-family: 'Montserrat', sans-serif;
      font-size: 22px;
      font-weight: 900;
      color: var(--black);
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .gender-pill {
      display: inline-block;
      background: var(--orange-pale);
      border: 1px solid rgba(232,93,4,0.2);
      color: var(--orange);
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
      margin-bottom: 16px;
    }

    .modal-description {
      font-size: 14px;
      font-weight: 300;
      color: var(--gray-700);
      line-height: 1.7;
      margin-bottom: 24px;
    }

    .modal-section-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gray-500);
      margin-bottom: 12px;
    }

    .notes-pyramid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    .notes-col {
      background: var(--gray-100);
      border-radius: 8px;
      padding: 10px 12px;
    }

    .notes-col-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--orange);
      margin-bottom: 8px;
    }

    .note-item {
      font-size: 12px;
      color: var(--gray-700);
      padding: 2px 0;
      line-height: 1.5;
    }

    .accords-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 28px;
    }

    .accord-pill {
      background: var(--orange-pale);
      color: var(--orange);
      border: 1px solid rgba(232,93,4,0.2);
      font-size: 12px;
      font-weight: 500;
      padding: 5px 12px;
      border-radius: 20px;
    }

    .price-table {
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    .price-row {
      display: flex;
      align-items: center;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      gap: 10px;
    }

    .price-row:last-child { border-bottom: none; }
    .price-row.best { background: var(--orange-pale); }

    .price-row-rank {
      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      font-weight: 900;
      color: var(--gray-300);
      width: 18px;
      flex-shrink: 0;
    }

    .price-row.best .price-row-rank { color: var(--orange); }

    .price-row-store {
      flex: 1;
      font-size: 13px;
      font-weight: 500;
      color: var(--black);
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .price-row-val {
      font-family: 'Montserrat', sans-serif;
      font-size: 15px;
      font-weight: 900;
      color: var(--black);
      flex-shrink: 0;
    }

    .price-row.best .price-row-val { color: var(--orange); }

    .btn-store-link {
      display: inline-block;
      background: none;
      border: 1.5px solid var(--border);
      color: var(--gray-700);
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      text-decoration: none;
      flex-shrink: 0;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
      white-space: nowrap;
    }

    .btn-store-link:hover { background: var(--orange); border-color: var(--orange); color: var(--white); }
  </style>
</head>
<body>

<!-- ─── TELA DE LOGIN ─── -->
<div id="screen-login" class="screen">
  <div class="login-card">
    <p class="login-eyebrow">Vguerise</p>
    <h1 class="login-title">Radar de Perfumes Nicho</h1>
    <p class="login-subtitle">Compare preços em tempo real entre as<br>principais lojas de nicho do Brasil.</p>
    <form class="login-form" id="form-login" novalidate>
      <input class="input-field" type="email" id="input-email"
        placeholder="Seu e-mail" autocomplete="email" required>
      <button class="btn-primary" type="submit" id="btn-login">Entrar</button>
      <p class="form-error" id="login-error" role="alert"></p>
    </form>
  </div>
</div>

<!-- ─── TELA DO APP ─── -->
<div id="screen-app" class="screen">
  <header class="app-header">
    <span class="app-brand">Radar · Perfumes</span>
    <button class="btn-logout" id="btn-logout">Sair</button>
  </header>

  <div class="search-bar">
    <div class="search-row">
      <input class="input-search" type="text" id="input-search"
        placeholder="Ex: Xerjoff Naxos 100ml" autocomplete="off" spellcheck="false">
      <button class="btn-search" id="btn-search">Buscar</button>
    </div>
  </div>

  <div id="featured-section"></div>
  <div class="results-wrap" id="results-wrap" style="display:none"></div>
</div>

<!-- ─── MODAL ─── -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box" id="modal-box"></div>
</div>

<script>
(function () {
  const TOKEN_KEY = 'radar_token';
  const API = 'https://radar-perfumes.vercel.app/api';

  function getToken() { return localStorage.getItem(TOKEN_KEY); }
  function saveToken(t) { localStorage.setItem(TOKEN_KEY, t); }
  function removeToken() { localStorage.removeItem(TOKEN_KEY); }

  function show(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function formatBRL(cents) {
    return (cents / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  }

  function timeAgo(iso) {
    const h = Math.floor((Date.now() - new Date(iso).getTime()) / 3600000);
    if (h < 1) return 'agora mesmo';
    return h === 1 ? 'há 1h' : `há ${h}h`;
  }

  function esc(str) {
    return String(str || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ── Init ──
  (async function init() {
    const t = getToken();
    if (!t) return show('screen-login');
    try {
      const r = await fetch(`${API}/auth/verify`, { headers: { Authorization: `Bearer ${t}` } });
      if (r.ok) { show('screen-app'); loadFeatured(); }
      else { removeToken(); show('screen-login'); }
    } catch {
      show('screen-app'); loadFeatured();
    }
  })();

  // ── Login ──
  document.getElementById('form-login').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('input-email').value.trim();
    const btn = document.getElementById('btn-login');
    const err = document.getElementById('login-error');
    err.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Entrando…';
    try {
      const r = await fetch(`${API}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || 'Falha no servidor');
      saveToken(data.token);
      show('screen-app');
      loadFeatured();
    } catch (ex) {
      err.textContent = ex.message;
    } finally {
      btn.disabled = false;
      btn.textContent = 'Entrar';
    }
  });

  // ── Logout ──
  document.getElementById('btn-logout').addEventListener('click', () => {
    removeToken();
    document.getElementById('input-search').value = '';
    document.getElementById('results-wrap').style.display = 'none';
    document.getElementById('results-wrap').innerHTML = '';
    document.getElementById('featured-section').style.display = '';
    show('screen-login');
  });

  // ── Featured ──
  let featuredData = [];

  async function loadFeatured() {
    const section = document.getElementById('featured-section');
    section.style.display = '';
    document.getElementById('results-wrap').style.display = 'none';
    section.innerHTML = '<div class="state-box"><div class="spinner"></div>Carregando ofertas…</div>';

    try {
      const r = await fetch(`${API}/perfumes/featured`, {
        headers: { Authorization: `Bearer ${getToken()}` }
      });
      if (r.status === 401) { removeToken(); return show('screen-login'); }
      if (!r.ok) throw new Error(`Erro ${r.status}`);

      const { featured } = await r.json();
      featuredData = featured || [];
      renderFeatured(featuredData);
    } catch {
      section.innerHTML = '<div class="state-box">Não foi possível carregar as ofertas agora.</div>';
    }
  }

  function renderFeatured(items) {
    const section = document.getElementById('featured-section');
    if (!items.length) {
      section.innerHTML = '<div class="state-box">Nenhuma oferta disponível ainda.<br>Faça uma busca para começar!</div>';
      return;
    }

    section.innerHTML = `
      <div class="featured-header">
        <span class="featured-title">Melhores Ofertas</span>
        <span class="featured-count">${items.length} perfumes</span>
      </div>
      <div class="perf-grid">
        ${items.map((item, i) => {
          const letter = esc((item.brand || item.display_name || '?')[0].toUpperCase());
          return `
            <div class="perf-card" onclick="openDetail(${i})">
              ${item.image_url
                ? `<img class="perf-card-thumb" src="${esc(item.image_url)}" alt="" loading="lazy">`
                : `<div class="perf-card-placeholder">${letter}</div>`}
              <div class="perf-card-body">
                <div class="perf-card-brand">${esc(item.brand || '')}</div>
                <div class="perf-card-name">${esc(item.display_name)}</div>
                <div class="perf-card-footer">
                  <div>
                    <div class="perf-card-price">${formatBRL(item.min_price)}</div>
                    <div class="perf-card-store">${esc(item.best_store || '')}</div>
                  </div>
                  ${item.savings_pct > 0 ? `<span class="savings-badge">-${item.savings_pct}%</span>` : ''}
                </div>
              </div>
            </div>`;
        }).join('')}
      </div>`;
  }

  // ── Modal ──
  function openDetail(idx) {
    const deal = featuredData[idx];
    if (!deal) return;

    const sorted = [...(deal.results || [])].filter(r => r.price_cents > 0).sort((a, b) => a.price_cents - b.price_cents);
    const letter = esc((deal.brand || deal.display_name || '?')[0].toUpperCase());
    const hasNotes = deal.notes_top?.length || deal.notes_heart?.length || deal.notes_base?.length;

    document.getElementById('modal-box').innerHTML = `
      <div class="modal-topbar">
        <button class="modal-close" onclick="closeDetail()">✕</button>
      </div>
      ${deal.image_url
        ? `<img class="modal-img" src="${esc(deal.image_url)}" alt="">`
        : `<div class="modal-placeholder">${letter}</div>`}
      <div class="modal-content">
        <div class="modal-brand">${esc(deal.brand || '')}</div>
        <div class="modal-name">${esc(deal.display_name)}</div>
        <span class="gender-pill">${esc(deal.gender || 'unissex')}</span>
        ${deal.description ? `<p class="modal-description">${esc(deal.description)}</p>` : ''}

        ${hasNotes ? `
          <div class="modal-section-label">Pirâmide Olfativa</div>
          <div class="notes-pyramid">
            <div class="notes-col">
              <div class="notes-col-label">Topo</div>
              ${(deal.notes_top || []).map(n => `<div class="note-item">${esc(n)}</div>`).join('')}
            </div>
            <div class="notes-col">
              <div class="notes-col-label">Coração</div>
              ${(deal.notes_heart || []).map(n => `<div class="note-item">${esc(n)}</div>`).join('')}
            </div>
            <div class="notes-col">
              <div class="notes-col-label">Fundo</div>
              ${(deal.notes_base || []).map(n => `<div class="note-item">${esc(n)}</div>`).join('')}
            </div>
          </div>
        ` : ''}

        ${deal.accords?.length ? `
          <div class="modal-section-label">Acordes</div>
          <div class="accords-wrap">
            ${deal.accords.map(a => `<span class="accord-pill">${esc(a)}</span>`).join('')}
          </div>
        ` : ''}

        ${sorted.length ? `
          <div class="modal-section-label">Comparar Preços</div>
          <div class="price-table">
            ${sorted.map((r, i) => `
              <div class="price-row${i === 0 ? ' best' : ''}">
                <span class="price-row-rank">#${i + 1}</span>
                <span class="price-row-store">${esc(r.store_display_name || r.store || '')}</span>
                <span class="price-row-val">${formatBRL(r.price_cents)}</span>
                ${r.product_url ? `<a class="btn-store-link" href="${esc(r.product_url)}" target="_blank" rel="noopener">ver</a>` : ''}
              </div>`).join('')}
          </div>
        ` : ''}
      </div>`;

    document.getElementById('modal-overlay').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeDetail() {
    document.getElementById('modal-overlay').classList.remove('open');
    document.body.style.overflow = '';
  }

  document.getElementById('modal-overlay').addEventListener('click', e => {
    if (e.target === document.getElementById('modal-overlay')) closeDetail();
  });

  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });

  // ── Busca ──
  function exitSearchMode() {
    document.getElementById('featured-section').style.display = '';
    document.getElementById('results-wrap').style.display = 'none';
    document.getElementById('results-wrap').innerHTML = '';
    document.getElementById('input-search').value = '';
  }

  async function doSearch() {
    const query = document.getElementById('input-search').value.trim();
    if (!query) return;

    const btn = document.getElementById('btn-search');
    const rw = document.getElementById('results-wrap');

    btn.disabled = true;
    document.getElementById('featured-section').style.display = 'none';
    rw.style.display = '';
    rw.innerHTML = '<div class="state-box"><div class="spinner"></div>Buscando nas lojas…</div>';

    try {
      const r = await fetch(`${API}/search?q=${encodeURIComponent(query)}`, {
        headers: { Authorization: `Bearer ${getToken()}` }
      });

      if (r.status === 401) { removeToken(); return show('screen-login'); }
      if (!r.ok) throw new Error(`Erro ${r.status}`);

      renderResults(await r.json());
    } catch {
      rw.innerHTML = '<div class="state-box">Falha na busca. Tente novamente.</div>';
    } finally {
      btn.disabled = false;
    }
  }

  function renderResults({ display_name, results, cached_at }) {
    const el = document.getElementById('results-wrap');
    const list = (results || []).filter(r => r.available !== false);
    const ago = cached_at ? timeAgo(cached_at) : '';

    if (!list.length) {
      el.innerHTML = `
        <div class="results-meta">
          <span></span>
          <button class="btn-back" onclick="exitSearchMode()">← Ofertas</button>
        </div>
        <div class="state-box" style="padding:48px 0">Não encontramos esse perfume nas lojas monitoradas.</div>`;
      return;
    }

    list.sort((a, b) => a.price_cents - b.price_cents);

    el.innerHTML = `
      <div class="results-meta">
        <span>${esc(display_name || '')}${ago ? ` · ${ago}` : ''}</span>
        <button class="btn-back" onclick="exitSearchMode()">← Ofertas</button>
      </div>
      ${list.map((item, i) => `
        <div class="result-card${i === 0 ? ' cheapest' : ''}">
          <span class="result-rank">#${i + 1}</span>
          <div class="result-info">
            <div class="result-store">${esc(item.store_display_name || item.store)}</div>
            <div class="result-name">${esc(item.product_name || display_name || '')}</div>
            ${ago ? `<div class="result-updated">atualizado ${ago}</div>` : ''}
          </div>
          <div class="result-price-block">
            <div class="result-price">${formatBRL(item.price_cents)}</div>
            <a class="btn-offer" href="${esc(item.product_url)}" target="_blank" rel="noopener noreferrer">ver oferta</a>
          </div>
        </div>`).join('')}`;
  }

  document.getElementById('btn-search').addEventListener('click', doSearch);
  document.getElementById('input-search').addEventListener('keydown', e => {
    if (e.key === 'Enter') doSearch();
  });

  window.openDetail = openDetail;
  window.closeDetail = closeDetail;
  window.exitSearchMode = exitSearchMode;
})();
</script>
</body>
</html>
